[project]
name = "benchdif"
version = "0.1.0"
description = "Differential item functioning and measurement invariance for AI/LLM benchmark evaluation"
readme = "README.md"
authors = [
    { name = "Abhay Mettu", email = "113219143+abhaymettu@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "statsmodels>=0.14.6",
]
